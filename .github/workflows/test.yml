name: Build ANY Geode Mod

on:
  workflow_dispatch:
    inputs:
      mod_repo:
        description: 'Ссылка на GitHub мода (например: https://github.com/geode-sdk/DevTools.git)'
        required: true
        type: string
      mod_branch:
        description: 'Ветка мода (оставь main или master)'
        required: true
        default: 'main'

jobs:
  build:
    name: Build Mod from URL
    runs-on: windows-latest

    steps:
      
      - name: Download and Install Geode CLI
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/cli/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "windows" -and $_.name -match "\.zip$" }
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile geode-cli.zip
          Expand-Archive geode-cli.zip -DestinationPath C:\geode-cli
          echo "C:\geode-cli" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

     
      - name: Setup Geode Profile
        run: |
          geode profile add CI "C:\GeometryDash"
          geode profile set CI

      
      - name: Clone Mod Repository
        run: |
          git clone --recursive -b ${{ inputs.mod_branch }} ${{ inputs.mod_repo }} C:\ModSource

     
      - name: Compile Mod
        working-directory: C:\ModSource
        run: |
          geode build --platform windows --config Release

      
      - name: Upload .geode File
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Geode-Mod
          path: C:\ModSource\build\**\*.geode
