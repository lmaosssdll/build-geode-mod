name: Build ANY Geode Mod

on:
  workflow_dispatch:
    inputs:
      mod_repo:
        description: 'Ссылка на GitHub мода (например: https://github.com/geode-sdk/DevTools.git)'
        required: true
        type: string
      mod_branch:
        description: 'Ветка мода (оставь main или master)'
        required: true
        default: 'main'

jobs:
  build:
    name: Build Mod from URL
    runs-on: windows-latest

    steps:
      # 1. Скачиваем CLI через официальный GitHub CLI
      - name: Download and Install Geode CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir C:\geode-zip
          gh release download -R geode-sdk/cli -p "*win*.zip" --dir C:\geode-zip
          Expand-Archive C:\geode-zip\*.zip -DestinationPath C:\geode-cli
          $GeodeDir = (Get-ChildItem -Path C:\geode-cli -Filter "geode.exe" -Recurse).Directory.FullName
          Write-Host "geode.exe найден в: $GeodeDir"
          echo "$GeodeDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 2. Настраиваем фейковый профиль GD (НОВЫЙ СИНТАКСИС)
      - name: Setup Geode Profile
        run: |
          mkdir C:\GeometryDash
          geode profile add --name CI "C:\GeometryDash" win

      # 3. Клонируем нужный тебе мод
      - name: Clone Mod Repository
        run: |
          git clone --recursive -b ${{ inputs.mod_branch }} ${{ inputs.mod_repo }} C:\ModSource

      # 4. Собираем мод
      - name: Compile Mod
        working-directory: C:\ModSource
        run: |
          geode build --platform windows --config Release

      # 5. Отдаем готовый файл
      - name: Upload .geode File
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Geode-Mod
          path: C:\ModSource\build\**\*.geode
