name: Manual Geode Build

on:
  workflow_dispatch:
    inputs:
      sdk_repo:
        description: 'Ссылка на репозиторий Geode SDK'
        required: true
        default: 'https://github.com/geode-sdk/geode.git'
      sdk_branch:
        description: 'Ветка или коммит SDK (например, main)'
        required: true
        default: 'main'

jobs:
  build-windows:
    name: Build Mod (Windows)
    runs-on: windows-latest

    steps:
      # 1. Скачиваем исходники ТВОЕГО мода
      - name: Checkout Mod Repository
        uses: actions/checkout@v4

      # 2. Скачиваем и устанавливаем Geode CLI вручную
      - name: Download and Install Geode CLI
        run: |
          Invoke-WebRequest -Uri https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-windows.zip -OutFile geode-cli.zip
          Expand-Archive geode-cli.zip -DestinationPath C:\geode-cli
          echo "C:\geode-cli" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 3. Клонируем указанный тобой репозиторий Geode SDK
      - name: Clone Custom Geode SDK
        run: |
          git clone -b ${{ github.event.inputs.sdk_branch }} ${{ github.event.inputs.sdk_repo }} C:\geode-sdk

      # 4. Указываем системе, где лежит наш SDK
      - name: Set GEODE_SDK Environment Variable
        run: |
          echo "GEODE_SDK=C:\geode-sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 5. Настраиваем фейковый профиль GD (нужно для CLI, чтобы он не ругался на отсутствие игры)
      - name: Setup Geode CLI Profile
        run: |
          geode profile add CI "C:\GeometryDash"
          geode profile set CI

      # 6. Собираем мод!
      # Команда 'geode build' сама вызовет CMake, подцепит твой SDK из C:\geode-sdk и запакует .geode
      - name: Build Mod using CMake & CLI
        run: |
          geode build --platform windows --config Release

      # 7. Ищем готовый файл .geode и сохраняем его
      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Windows-Build
          path: build/**/*.geode # Ищет файл .geode в папке build
