name: Build ANY Geode Mod (Cached & Auto-Fix)

on:
  workflow_dispatch:
    inputs:
      mod_repo:
        description: 'Mod repo (URL or owner/repo)'
        required: true
        type: string
      mod_branch:
        description: 'Branch'
        required: true
        default: 'main'
      platform: 
        description: 'Platform (win, android32, android64)'
        required: true
        type: string
        default: 'win'

jobs:
  build:
    name: Build Mod from URL
    runs-on: windows-latest

    steps:
      - name: Parse Repository URL
        id: repo_parser
        run: |
          $inputRepo = "${{ inputs.mod_repo }}"
          $cleanRepo = $inputRepo -replace "^https?://(www\.)?github\.com/", ""
          $cleanRepo = $cleanRepo -replace "\.git$", ""
          $cleanRepo = $cleanRepo.Trim("/")
          
          Write-Host "Cleaned repository format: $cleanRepo"
          echo "repo=$cleanRepo" >> $env:GITHUB_OUTPUT
          
          $repoId = $cleanRepo -replace '[^a-zA-Z0-9]', '-'
          echo "repo_id=$repoId" >> $env:GITHUB_OUTPUT

      - name: Checkout Mod Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo_parser.outputs.repo }}
          ref: ${{ inputs.mod_branch }}
          submodules: recursive
          path: ModSource

      - name: Auto-fix malformed mod.json & Encoding
        run: |
          $jsonPath = if (Test-Path "ModSource\geode.json") { "ModSource\geode.json" } elseif (Test-Path "ModSource\mod.json") { "ModSource\mod.json" } else { throw "mod.json not found!" }
          $content = Get-Content $jsonPath -Raw
          
          $pattern = '([\}\]"0-9a-zA-Z])(\s*[\r\n]+\s*)(?="[a-zA-Z0-9\-_]+"\s*:)'
          $content = [System.Text.RegularExpressions.Regex]::Replace($content, $pattern, '$1,$2')
          $content = [System.Text.RegularExpressions.Regex]::Replace($content, '(?s)"dependentold"\s*:\s*\[.*?\],?\s*', '')
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $jsonPath).Path, $content, $utf8NoBom)
          
          Write-Host "mod.json syntax auto-fixed and saved WITHOUT BOM!"

      - name: Parse Mod Configuration
        id: parse_mod
        run: |
          $jsonPath = if (Test-Path "ModSource\geode.json") { "ModSource\geode.json" } else { "ModSource\mod.json" }
          $rawContent = Get-Content $jsonPath -Raw
          
          if ($rawContent -match '"geode"\s*:\s*"([^"]+)"') {
              $rawVersion = $matches[1]
          } else {
              throw "Failed to find 'geode' version in $jsonPath"
          }
          
          $cleanVersion = $rawVersion -replace '[>=^~v\s]', ''
          $tag = "v$cleanVersion"
          Write-Host "Geode Version required: $tag"
          echo "sdk_version=$tag" >> $env:GITHUB_OUTPUT

      - name: Cache Geode CLI
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: geode-cli
          key: geode-cli-windows-latest

      - name: Download Geode CLI (If not cached)
        if: steps.cache-cli.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir geode-zip
          gh release download -R geode-sdk/cli -p "*win*.zip" --dir geode-zip
          Expand-Archive geode-zip\*.zip -DestinationPath geode-cli

      - name: Add CLI to PATH and Setup Profile
        run: |
          $GeodeDir = (Get-ChildItem -Path geode-cli -Filter "geode.exe" -Recurse).Directory.FullName
          echo "$GeodeDir" >> $env:GITHUB_PATH
          New-Item -Path "C:\GeometryDash\geode\mods" -ItemType Directory -Force
          & "$GeodeDir\geode.exe" profile add --name CI "C:\GeometryDash" win

      - name: Cache Geode SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: geode-sdk
          key: geode-sdk-windows-${{ steps.parse_mod.outputs.sdk_version }}

      - name: Clone Geode SDK (If not cached)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --branch ${{ steps.parse_mod.outputs.sdk_version }} https://github.com/geode-sdk/geode.git geode-sdk

      - name: Setup SDK Environment Variables
        run: |
          $sdkPath = Resolve-Path "geode-sdk"
          echo "GEODE_SDK=$sdkPath" >> $env:GITHUB_ENV

      - name: Install LLVM 19 (Windows)
        if: inputs.platform == 'win'
        run: |
          Write-Host "Downloading LLVM 19.1.0..."
          curl.exe -fsSL -o LLVM.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.0/LLVM-19.1.0-win64.exe
          Write-Host "Extracting LLVM..."
          7z x LLVM.exe -oC:\LLVM
          echo "C:\LLVM\bin" >> $env:GITHUB_PATH
          echo "LLVMInstallDir=C:\LLVM" >> $env:GITHUB_ENV

      - name: Setup Android NDK
        if: contains(inputs.platform, 'android')
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          add-to-path: false

      - name: Set Android Environment Variable
        if: contains(inputs.platform, 'android')
        run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $env:GITHUB_ENV

      - name: Cache CMake Build
        uses: actions/cache@v4
        with:
          path: |
            ModSource/build
            ModSource/.geode
          key: build-v3-${{ inputs.platform }}-${{ steps.repo_parser.outputs.repo_id }}-${{ github.run_id }}
          restore-keys: |
            build-v3-${{ inputs.platform }}-${{ steps.repo_parser.outputs.repo_id }}-

      - name: Install SDK Binaries
        run: geode sdk install-binaries --platform ${{ inputs.platform }}

      - name: Validate Geode Project
        working-directory: ModSource
        run: geode project check .
        
      # --- 1. ПЕРВЫЙ ЗАПУСК СБОРКИ (ОНА УПАДЕТ, НО СКАЧАЕТ БИБЛИОТЕКУ) ---
      - name: Compile Mod (Initial Run)
        working-directory: ModSource
        continue-on-error: true # <-- Игнорируем ошибку!
        run: geode build --platform ${{ inputs.platform }} --config Release

      # --- 2. ВЛЕТАЕМ И ЧИНИМ СКАЧАННЫЙ ФАЙЛ ---
      - name: Auto-Patch NDK r28 bug in Dependency
        working-directory: ModSource
        run: |
          $buggyFile = "build-${{ inputs.platform }}\_deps\nontype_functional-src\include\std23\move_only_function.h"
          if (Test-Path $buggyFile) {
              $content = Get-Content $buggyFile -Raw
              if (-not ($content -match "<type_traits>")) {
                  Write-Host "File found! Injecting <type_traits> fix..."
                  $content = "#include <type_traits>`n" + $content
                  Set-Content $buggyFile $content
              } else {
                  Write-Host "File is already patched."
              }
          } else {
              Write-Host "Buggy file not generated or not found. Skipping patch."
          }

      # --- 3. ВТОРОЙ ЗАПУСК СБОРКИ (ПРОДОЛЖАЕТ И ЗАВЕРШАЕТСЯ УСПЕШНО) ---
      - name: Compile Mod (Final Run)
        working-directory: ModSource
        run: geode build --platform ${{ inputs.platform }} --config Release

      - name: Upload .geode File
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Geode-Mod-${{ inputs.platform }}
          path: ModSource/build/**/*.geode
